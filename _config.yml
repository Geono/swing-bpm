title: swing-bpm
description: Automatic BPM detection optimized for swing & jazz music
remote_theme: just-the-docs/just-the-docs

url: https://geono.github.io
baseurl: /swing-bpm

color_scheme: dark

aux_links:
  "GitHub":
    - "https://github.com/Geono/swing-bpm"
  "PyPI":
    - "https://pypi.org/project/swing-bpm/"

aux_links_new_tab: true

heading_anchors: true

nav_enabled: true

search_enabled: true
search:
  heading_level: 2
  previews: 3

footer_content: "swing-bpm is released under the <a href=\"https://github.com/Geono/swing-bpm/blob/main/LICENSE\">MIT License</a>."

plugins:
  - jekyll-sitemap
  - jekyll-remote-theme

back_to_top: true
back_to_top_text: "Back to top"

callouts:
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
